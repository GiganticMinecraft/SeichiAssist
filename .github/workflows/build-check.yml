name: build check

on:
  push:
    branches:
      - develop
      - master
    paths:
      - src/**
      - build.sbt
      - .scalafix.conf
      - .scalafmt.conf
      - project/*
      - .github/workflows/**.yml
      - .github/actions/**/**.yml
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      sbt: ${{ steps.filter.outputs.sbt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Detect changed paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            sbt:
              - src/**
              - build.sbt
              - .scalafix.conf
              - .scalafmt.conf
              - project/*
              - .github/workflows/**.yml
              - .github/actions/**/**.yml

  build_check:
    needs: changes
    if: needs.changes.outputs.sbt == 'true'
    runs-on: ubuntu-24.04
    container: ghcr.io/giganticminecraft/seichiassist-builder-v2:776da10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: 'recursive'

      - name: Prepare build environment for seichiassist
        uses: ./.github/actions/prepare-build-environment-for-seichiassist

      - name: Check format with Scalafmt
        run: ./sbt scalafmtCheckAll

      - name: Check lint with Scalafix on push
        run: ./sbt "scalafix --check"

      - name: Test and build artifact
        run: mkdir -p target/build && ./sbt assembly

      - name: Clean build artifact for caching target folder
        run: rm -r target/build

      - name: Upload dependency graph
        if: github.ref == 'refs/heads/develop'
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3

  ci-gate:
    name: CI Gate
    needs:
      - changes
      - build_check
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check required CI jobs
        run: |
          echo '${{ toJson(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
