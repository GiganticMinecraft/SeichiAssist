name: Docker build check

on:
  workflow_call:

jobs:
  docker_build_check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare Paper build context
        run: mkdir -p target/build

      - name: Build Paper image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/paper/Dockerfile
          tags: seichiassist-paper:ci
          cache-from: type=gha,scope=seichiassist-paper
          cache-to: type=gha,mode=max,scope=seichiassist-paper

      - name: Build MariaDB image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/mariadb/Dockerfile
          tags: seichiassist-mariadb:ci
          cache-from: type=gha,scope=seichiassist-mariadb
          cache-to: type=gha,mode=max,scope=seichiassist-mariadb
